services:
  homepage:
    image: "{{ homepage_image }}"
    container_name: "{{ homepage_container_name }}"
    restart: unless-stopped
    ports:
      - "{{ homepage_port }}:3000"
    environment:
      HOMEPAGE_ALLOWED_HOSTS: "{{ homepage_allowed_hosts }}"
    volumes:
      - ./config:/app/config
      - "{{ homepage_docker_socket_path }}:/var/run/docker.sock:ro"
